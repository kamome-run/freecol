# Founding fathers
model.foundingFather.adamSmith.name=アダム・スミス
model.foundingFather.adamSmith.description=工場を建設できるようになります。
model.foundingFather.adamSmith.text=近代経済学の父として知られるスミスは、最も有名な著作『国富論』をはじめ、経済理論に関する数々の著作を執筆しました。
model.foundingFather.adamSmith.birthAndDeath=1723年-1790年

model.foundingFather.jacobFugger.name=ヤーコプ・フッガー2世
model.foundingFather.jacobFugger.description=現在発効中のボイコットがすべて解除されます。
model.foundingFather.jacobFugger.text=きわめて裕福なドイツの商人にして銀行家です。一族の共同経営と鉱山業への出資によって巨万の富を築きました。
model.foundingFather.jacobFugger.birthAndDeath=1459年-1525年

model.foundingFather.peterMinuit.name=ピーター・ミニュイット
model.foundingFather.peterMinuit.description=先住民が土地の代金を要求しなくなります。
model.foundingFather.peterMinuit.text=後にマンハッタン島として知られることになる土地を、約60ギルダーでアメリカ先住民から買い取りました。その後、デラウェア湾一帯の植民にも携わりました。
model.foundingFather.peterMinuit.birthAndDeath=1580年-1638年

model.foundingFather.peterStuyvesant.name=ピーター・ストイフェサント
model.foundingFather.peterStuyvesant.description=税関を建設できるようになります。
model.foundingFather.peterStuyvesant.text=ニューネーデルラントの総督に任命されました。ニューネーデルラントは、彼が食い止められなかったイングランドの侵攻の後、ニューヨークとなりました。
model.foundingFather.peterStuyvesant.birthAndDeath=1592年-1672年

model.foundingFather.janDeWitt.name=ヨハン・デ・ウィット
model.foundingFather.janDeWitt.description=外国の植民地と交易できるようになり、ライバル植民地についてより多くの情報が表示されます。
model.foundingFather.janDeWitt.text=デ・ウィットはオランダの偉大な政治家です。商人層の利益を代表し、産業と商業を奨励しました。また、イングランドとの戦争を終結させるいくつもの重要な条約をまとめました。
model.foundingFather.janDeWitt.birthAndDeath=1625年-1672年

model.foundingFather.ferdinandMagellan.name=フェルディナンド・マゼラン
model.foundingFather.ferdinandMagellan.description=海上ユニットの移動力が1増加し、ヨーロッパと新大陸の間の航海にかかる時間が短縮されます。
model.foundingFather.ferdinandMagellan.text=世界を航海した最も偉大な探検家の一人です。マゼランは史上初めて世界を一周する航海を率い、太平洋を横断しました。
model.foundingFather.ferdinandMagellan.birthAndDeath=1480年-1521年

model.foundingFather.franciscoDeCoronado.name=フランシスコ・デ・コロナド
model.foundingFather.franciscoDeCoronado.description=既存のすべての植民地がマップ上に表示されます。
model.foundingFather.franciscoDeCoronado.text=グランドキャニオンを目にした最初のヨーロッパ人探検家です。探し求めた黄金の都市は見つけられませんでしたが、現在アメリカ南西部と呼ばれる地域を地図に記録したことは、その後の探検にとって重要なものとなりました。
model.foundingFather.franciscoDeCoronado.birthAndDeath=1510年-1554年

model.foundingFather.hernandoDeSoto.name=エルナンド・デ・ソト
model.foundingFather.hernandoDeSoto.description=失われた都市の噂を探索しても悪い結果が出なくなり、すべての陸上ユニットの視界が広がります。
model.foundingFather.hernandoDeSoto.text=フロリダとアメリカ南東部を探検した最初のヨーロッパ人です。中央アメリカの征服でも重要な役割を担いました。
model.foundingFather.hernandoDeSoto.birthAndDeath=1496年-1542年

model.foundingFather.henryHudson.name=ヘンリー・ハドソン
model.foundingFather.henryHudson.description=すべての罠猟師の生産量が100%増加します。
model.foundingFather.henryHudson.text=北アメリカ大陸北東部の広大な地域を探検し、地図に記したイングランドの航海者です。この地域の多くの水路が彼にちなんで名付けられています。当初の目的は、かの有名な北西航路を見つけることでした。
model.foundingFather.henryHudson.birthAndDeath=1565年-1611年

model.foundingFather.laSalle.name=ロベール・ド・ラ・サール
model.foundingFather.laSalle.description=既存および今後のすべての植民地に、人口が3に達した時点で木柵が与えられます。
model.foundingFather.laSalle.text=ミシシッピ川を全長にわたって旅した最初のヨーロッパ人であるラ・サールは、川沿いに数多くの交易拠点を築く任務を負っていました。後に流域全体をフランス国王にちなんでルイジアナと名付け、その領有を宣言しました。その後、五大湖のいくつかも探検しました。
model.foundingFather.laSalle.birthAndDeath=1643年-1687年

model.foundingFather.hernanCortes.name=エルナン・コルテス
model.foundingFather.hernanCortes.description=先住民の集落を征服すると必ず(しかもより多くの)財宝が得られ、国王のガレオン船がそれを無料で運んでくれます。
model.foundingFather.hernanCortes.text=アステカ帝国を滅ぼし、メキシコをスペイン領としたことで名高いスペインのコンキスタドールです。
model.foundingFather.hernanCortes.birthAndDeath=1485年-1547年

model.foundingFather.georgeWashington.name=ジョージ・ワシントン
model.foundingFather.georgeWashington.description=戦闘に勝利した兵士や竜騎兵は、昇進できる場合は自動的に次の階級へ昇進します。
model.foundingFather.georgeWashington.text=ワシントン将軍は植民地軍を率いてイギリス軍に勝利し、植民地の独立を勝ち取りました。この勝利と彼の指導力により、新国家の初代大統領に選ばれました。
model.foundingFather.georgeWashington.birthAndDeath=1732年-1799年

model.foundingFather.paulRevere.name=ポール・リビア
model.foundingFather.paulRevere.description=兵士のいない植民地が攻撃されると、入植者が自動的に備蓄のマスケット銃を手に取って防衛します。
model.foundingFather.paulRevere.text=植民地時代アメリカの名高い騎手で、馬にまたがって田園地帯を駆け抜け、イギリス兵が迫っていることを入植者たちに知らせました。その途中で捕らえられましたが、捕らえた側が自分たちは重大な危険にさらされており、捕虜がいては足手まといになると考えたため、後に解放されました。
model.foundingFather.paulRevere.birthAndDeath=1734年-1818年

model.foundingFather.francisDrake.name=フランシス・ドレーク
model.foundingFather.francisDrake.description=すべての私掠船の戦闘力が50%増加します。
model.foundingFather.francisDrake.text=イングランドの偉大な船乗りであるドレークは、イングランド人として初めて世界周航を成し遂げ、スペインの無敵艦隊との戦いで英雄となりました。
model.foundingFather.francisDrake.birthAndDeath=1542年-1596年

model.foundingFather.johnPaulJones.name=ジョン・ポール・ジョーンズ
model.foundingFather.johnPaulJones.description=植民地海軍にフリゲート艦が1隻(無料で)加わります。
model.foundingFather.johnPaulJones.text=アメリカの偉大な船乗りと称えられるジョーンズは、海上でイギリス軍と戦った際に「まだ戦いは始まってもいない」という有名な言葉を残しました。その後、イギリス艦の甲板から、自らの船が海の底へ沈んでいくのを見届けることになりました。
model.foundingFather.johnPaulJones.birthAndDeath=1741年-1792年

model.foundingFather.thomasJefferson.name=トーマス・ジェファーソン
model.foundingFather.thomasJefferson.description=植民地の自由の鐘の生産量が50%増加します。
model.foundingFather.thomasJefferson.text=愛国心を力強く訴えたジェファーソンは、独立宣言の起草者として知られています。後にアメリカ合衆国第3代大統領となりました。
model.foundingFather.thomasJefferson.birthAndDeath=1743年-1826年

model.foundingFather.pocahontas.name=ポカホンタス
model.foundingFather.pocahontas.description=先住民との緊張がすべて解消され、先住民の警戒が高まる速さが半分になります。
model.foundingFather.pocahontas.text=初期のジェームズタウン入植者とアメリカ先住民との間を取り持った和平の使者です。厳しい時期に、飢えに苦しむ入植者たちへ食料や物資を送ったと伝えられています。後にキリスト教に改宗し、イングランド人と結婚しました。
model.foundingFather.pocahontas.birthAndDeath=1595年-1617年

model.foundingFather.thomasPaine.name=トマス・ペイン
model.foundingFather.thomasPaine.description=植民地の自由の鐘の生産量が、現在の税率の分だけ増加します。
model.foundingFather.thomasPaine.text=ベンジャミン・フランクリンの勧めを受け、その筆によって入植者たちを鼓舞しました。パンフレット『コモン・センス』を出版し、植民地全土の愛国者たちの思想を導きました。
model.foundingFather.thomasPaine.birthAndDeath=1737年-1809年

model.foundingFather.simonBolivar.name=シモン・ボリバル
model.foundingFather.simonBolivar.description=既存のすべての植民地で自由の息子の支持率が20%上昇します。
model.foundingFather.simonBolivar.text=スペインからの南アメリカ独立闘争における偉大な指導者として記憶されています。ボリバルは現在のベネズエラを解放し、後にその初代大統領となりました。
model.foundingFather.simonBolivar.birthAndDeath=1783年-1830年

model.foundingFather.benjaminFranklin.name=ベンジャミン・フランクリン
model.foundingFather.benjaminFranklin.description=王室の対外戦争が新大陸での関係に影響しなくなり、新大陸のヨーロッパ諸国は交渉の際に常に和平を申し出るようになります。
model.foundingFather.benjaminFranklin.text=独立宣言に多大な貢献をしたフランクリンは、革命を代表する声の一人でした。ヨーロッパと植民地の間を幾度も往来し、独立戦争でフランスの支援を取り付けました。
model.foundingFather.benjaminFranklin.birthAndDeath=1706年-1790年

model.foundingFather.williamBrewster.name=ウィリアム・ブルースター
model.foundingFather.williamBrewster.description=犯罪者や年季奉公人が船着き場に現れなくなり、募集候補の中からどの移民を船着き場に送るか選べるようになります。
model.foundingFather.williamBrewster.text=ブルースターはニューイングランドのプリマス植民地におけるピューリタンの指導者でした。
model.foundingFather.williamBrewster.birthAndDeath=1567年-1644年

model.foundingFather.williamPenn.name=ウィリアム・ペン
model.foundingFather.williamPenn.description=すべての植民地で十字架の生産量が50%増加します。
model.foundingFather.williamPenn.text=ヨーク公の親しい友人であったペンは、現在のペンシルベニア、デラウェア、ニュージャージーの大部分にあたる土地を与えられました。仲間のクエーカー教徒に安住の地を提供するため、数年にわたりこのクエーカー植民地を統治しました。
model.foundingFather.williamPenn.birthAndDeath=1644年-1718年

model.foundingFather.fatherJeanDeBrebeuf.name=ジャン・ド・ブレブフ神父
model.foundingFather.fatherJeanDeBrebeuf.description=すべての宣教師が熟練者として活動します。
model.foundingFather.fatherJeanDeBrebeuf.text=ヒューロン族と親交を結び、多くの人々をキリスト教に改宗させました。宿敵ヒューロン族をついに打ち破ったイロコイ族の手にかかり、命を落としました。
model.foundingFather.fatherJeanDeBrebeuf.birthAndDeath=1593年-1649年

model.foundingFather.juanDeSepulveda.name=フアン・デ・セプルベダ
model.foundingFather.juanDeSepulveda.description=征服した先住民の集落の住民が「改宗」して植民地に加わる確率が20%上昇します。
model.foundingFather.juanDeSepulveda.text=先住民の土地の征服と、先住民への強制的な布教を公然と唱えたスペインの神学者です。
model.foundingFather.juanDeSepulveda.birthAndDeath=1781年-1872年

model.foundingFather.bartolomeDeLasCasas.name=バルトロメ・デ・ラス・カサス
model.foundingFather.bartolomeDeLasCasas.description=既存のすべての先住民改宗者が自由入植者になります。
model.foundingFather.bartolomeDeLasCasas.text=インディアス各地を旅して先住民に布教し、先住民への処遇をめぐってスペインを厳しく非難したカトリックの司祭です。
model.foundingFather.bartolomeDeLasCasas.birthAndDeath=1474年-1566年

