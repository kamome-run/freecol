model.colony.badGovernment=%colony%の政府は非効率です。生産にペナルティが課せられます。
model.colony.goodGovernment=政府の効率が向上しました！%colony%の独立派の支持率が%number%パーセント以上になりました。
model.colony.governmentImproved1=%colony%の政府は改善しましたが、依然として非効率です。生産ペナルティは引き続き課せられます。
model.colony.governmentImproved2=%colony%の政府は改善しました。生産ペナルティはもう課せられません。
model.colony.insufficientProduction=%colony%では、%consumptionDeficit%が追加で手に入れば%outputType%をあと%outputAmount%生産できます。
model.colony.lostGoodGovernment=政府の効率が低下しました！%colony%の独立派の支持率が%number%パーセントを下回りました。植民地は生産ボーナスを受けられなくなりました。
model.colony.lostVeryGoodGovernment=政府の効率が低下しました！%colony%の独立派の支持率が%number%パーセントを下回りました。生産ボーナスの一部が失われました。
model.colony.minimumColonySize=%object%があるため、これ以上人口を減らせません。
model.colony.stance.alliance=%nation%は、信頼できる同盟者の来訪を喜んでいます。
model.colony.stance.ceaseFire=%nation%は険しい顔でこちらを睨み、明らかに防備を固めています。
model.colony.stance.peace=%nation%は礼儀正しく挨拶し、平和的な来訪かどうかを尋ねています。
model.colony.stance.uncontacted=%nation%は、見慣れない服装と聞き慣れない言葉に警戒の目を向けています。
