# --8-- Specification

# Building
model.building.armory.name=武器庫
model.building.armory.description=武器庫は道具からマスケット銃を生産するための建物です。人口が8に達し、アダム・スミスが大陸会議に加わっていれば、武器庫は弾薬庫、さらに兵器廠へとアップグレードできます。\n\n武器庫を建設すると、マスケット銃と大砲を生産できるようになります。
model.building.arsenal.name=兵器廠
model.building.arsenal.description=兵器廠は道具からマスケット銃を生産するための建物です。\n\n兵器廠を建設すると、マスケット銃の生産に必要な道具が半分で済むようになります。
model.building.blacksmithHouse.name=鍛冶小屋
model.building.blacksmithHouse.description=鍛冶小屋は鉱石を道具に加工するための建物で、鍛冶屋にアップグレードできます。道具は一部の建物の建設と、あらゆる建物のアップグレードに必要です。また、開拓者の装備やマスケット銃の生産にも使われます。植民地の人口が8に達し、アダム・スミスが大陸会議に加わっていれば、鍛冶屋を製鉄所に建て替えられます。
model.building.blacksmithShop.name=鍛冶屋
model.building.blacksmithShop.description=鍛冶屋は鉱石を道具に加工するための建物で、製鉄所にアップグレードできます。道具は一部の建物の建設と、あらゆる建物のアップグレードに必要です。また、開拓者の装備やマスケット銃の生産にも使われます。植民地の人口が8に達し、アダム・スミスが大陸会議に加わっていれば、鍛冶屋を製鉄所に建て替えられます。鍛冶屋は道具の生産量を増やします。
model.building.carpenterHouse.name=大工小屋
model.building.carpenterHouse.description=大工小屋は木材をハンマーに加工するための建物で、植民地の人口が3に達すると製材所にアップグレードできます。ハンマーはあらゆる建物の建設とアップグレードに必要です。
model.building.cathedral.name=大聖堂
model.building.cathedral.description=人口3以上の植民地では教会を建設でき、人口が8に達すると大聖堂にアップグレードできます。新大陸の信教の自由(十字架で表されます)は、ヨーロッパからの移民を増加させます。\n\n大聖堂を建設すると、十字架の生産量が増えます。
model.building.chapel.name=礼拝堂
model.building.chapel.description=礼拝堂は入植者が信仰を実践する場所です。礼拝堂はそれ自体で少量の十字架を生み出しますが、ここで説教師を働かせることはできません。まず礼拝堂を教会にアップグレードする必要があります。
model.building.church.name=教会
model.building.church.description=人口3以上の植民地では教会を建設でき、人口が8に達すると大聖堂にアップグレードできます。新大陸の信教の自由(十字架で表されます)は、ヨーロッパからの移民を増加させます。\n\n教会を建設すると十字架の生産量が増え、宣教師を任命できるようになります。
model.building.cigarFactory.name=葉巻工場
model.building.cigarFactory.description=葉巻工場はタバコから葉巻を生産するための建物で、これ以上アップグレードはできません。葉巻工場は葉巻の生産量を増やします。
model.building.college.name=学院
model.building.college.description=人口4以上の植民地では学校を建設でき、熟練職人が未熟な入植者に自分の技能を教えられるようになります。人口が8に達すると学院にアップグレードでき、2人の教師がより多くの技能を教えられます。人口が10に達すると学院を大学に建て替えることができ、3人の教師があらゆる技能を教えられます。\n\n学院では技能レベル2までの技能を教えられます。
model.building.country.name=牧草地
model.building.country.description=牧草地は植民地の近くにあり、馬が自由に歩き回る場所です。厩舎を建設すると馬の生産量が増えます。
model.building.customHouse.name=税関
model.building.customHouse.description=税関はピーター・ストイフェサントが大陸会議に加わると建設できるようになり、船を使わずに植民地から直接ヨーロッパへ物資を輸出できます。また、独立宣言後も外国と交易を続けられます。オプション設定によっては、ボイコットを無視することもできます。
model.building.depot.name=貯蔵庫
model.building.depot.description=貯蔵庫はあらゆる種類の物資を保管します。初期の容量は各物資100単位ですが、倉庫にアップグレードすると200単位になります。さらに倉庫増築を建設すると容量は300単位になります。
model.building.distillerHouse.name=蒸留小屋
model.building.distillerHouse.description=蒸留小屋はサトウキビからラム酒を生産するための建物で、ラム酒蒸留所にアップグレードできます。アダム・スミスが大陸会議に加わり、植民地の人口が8以上になると、ラム酒蒸留所をラム酒工場に建て替えられます。
model.building.docks.name=船着き場
model.building.docks.description=船着き場を建設すると、入植者が植民地に隣接する海のタイルで魚を獲れるようになります。人口が4以上になると乾ドックにアップグレードでき、損傷した船を修理できるようになります。植民地の人口が8に達すると、さらに造船所にアップグレードでき、新しい船を建造できるようになります。\n\n船着き場を建設すると漁ができるようになります。
model.building.drydock.name=乾ドック
model.building.drydock.description=乾ドックがあれば、入植者は植民地に隣接する海のタイルで魚を獲ることができ、船の修理も行えます。植民地の人口が8に達すると、さらに造船所にアップグレードでき、新しい船を建造できるようになります。\n\n乾ドックを建設すると船を修理できるようになります。
model.building.fort.name=砦
model.building.fort.description=砦は木柵を建設した後にのみ建設でき、入植者を攻撃から守ります。砦は防御力を高めるとともに、隣接する海のタイルにいる私掠船や敵の海上ユニットを砲撃します。人口が8に達すると砦を要塞に建て替えられます。\n\n砦を建設すると防御力が150%上昇します。
model.building.fortress.name=要塞
model.building.fortress.description=要塞は砦を建設した後、人口が8に達すると建設でき、入植者を攻撃から守ります。要塞は防御力を高めるとともに、隣接する海のタイルにいる私掠船や敵の海上ユニットを砲撃します。\n\n要塞を建設すると防御力が200%上昇します。
model.building.furFactory.name=毛皮工場
model.building.furFactory.description=毛皮工場は毛皮から毛皮のコートを生産するための建物で、これ以上アップグレードはできません。毛皮工場は毛皮のコートの生産量を増やします。
model.building.furTraderHouse.name=毛皮商の小屋
model.building.furTraderHouse.description=毛皮商の小屋は毛皮から毛皮のコートを生産するための建物で、毛皮交易所にアップグレードできます。植民地の人口が6に達し、アダム・スミスが大陸会議に加わっていれば、さらに毛皮工場にアップグレードできます。
model.building.furTradingPost.name=毛皮交易所
model.building.furTradingPost.description=毛皮交易所は毛皮から毛皮のコートを生産するための建物で、毛皮工場にアップグレードできます。植民地の人口が6に達し、アダム・スミスが大陸会議に加わっていれば、さらに毛皮工場にアップグレードできます。毛皮交易所は毛皮のコートの生産量を増やします。
model.building.ironWorks.name=製鉄所
model.building.ironWorks.description=製鉄所は鉱石を道具に加工するための建物で、これ以上アップグレードはできません。道具は一部の建物の建設と、あらゆる建物のアップグレードに必要です。また、開拓者の装備やマスケット銃の生産にも使われます。製鉄所は道具の生産量を増やします。
model.building.lumberMill.name=製材所
model.building.lumberMill.description=製材所は木材をハンマーに加工するための建物で、これ以上アップグレードはできません。ハンマーはあらゆる建物の建設とアップグレードに必要です。製材所はハンマーの生産量を増やします。
model.building.magazine.name=弾薬庫
model.building.magazine.description=弾薬庫は道具からマスケット銃を生産するための建物です。アダム・スミスが大陸会議に加わっていれば、弾薬庫を兵器廠にアップグレードできます。\n\n弾薬庫を建設すると、マスケット銃の生産量が100%増加します。
model.building.newspaper.name=新聞社
model.building.newspaper.description=新聞社は印刷所を建設した後、人口が4に達すると建設でき、自由の鐘の生産量を増やします。
model.building.printingPress.name=印刷所
model.building.printingPress.description=印刷所は植民地の自由の鐘の生産量を増やします。人口が4に達すると新聞社にアップグレードできます。
model.building.rumDistillery.name=ラム酒蒸留所
model.building.rumDistillery.description=ラム酒蒸留所はサトウキビからラム酒を生産するための建物で、ラム酒工場にアップグレードできます。アダム・スミスが大陸会議に加わり、植民地の人口が8以上になると、ラム酒蒸留所をラム酒工場に建て替えられます。ラム酒蒸留所はラム酒の生産量を増やします。
model.building.rumFactory.name=ラム酒工場
model.building.rumFactory.description=ラム酒工場はサトウキビからラム酒を生産するための建物で、これ以上アップグレードはできません。ラム酒工場はラム酒の生産量を増やします。
model.building.schoolhouse.name=学校
model.building.schoolhouse.description=人口4以上の植民地では学校を建設でき、熟練職人が未熟な入植者に自分の技能を教えられるようになります。人口が8に達すると学院にアップグレードでき、2人の教師がより多くの技能を教えられます。人口が10に達すると学院を大学に建て替えることができ、3人の教師があらゆる技能を教えられます。\n\n学校では技能レベル1の技能を教えられます。
model.building.shipyard.name=造船所
model.building.shipyard.description=造船所があれば、入植者は植民地に隣接する海のタイルで魚を獲ることができ、船の修理と建造も行えます。\n\n造船所を建設すると船を建造できるようになります。
model.building.stables.name=厩舎
model.building.stables.description=厩舎は繁殖に必要な群れの規模を小さくすることで、馬の最大生産量を増やします。
model.building.stockade.name=木柵
model.building.stockade.description=木柵は植民地の人口が3に達すると建設でき、入植者を攻撃から守ります。木柵は砦にアップグレードでき、砦はより高い防御力を持つとともに、隣接する海のタイルにいる私掠船や敵の海上ユニットを砲撃します。人口が8に達すると砦を要塞に建て替えられます。\n\n木柵を建設すると防御力が100%上昇します。
model.building.textileMill.name=織物工場
model.building.textileMill.description=織物工場は綿花から布を生産するための建物で、これ以上アップグレードはできません。織物工場は布の生産量を増やします。
model.building.tobacconistHouse.name=タバコ小屋
model.building.tobacconistHouse.description=タバコ小屋はタバコから葉巻を生産するための建物で、タバコ店にアップグレードできます。植民地の人口が8に達し、アダム・スミスが大陸会議に加わっていれば、さらに葉巻工場にアップグレードできます。
model.building.tobacconistShop.name=タバコ店
model.building.tobacconistShop.description=タバコ店はタバコから葉巻を生産するための建物で、葉巻工場にアップグレードできます。植民地の人口が8に達し、アダム・スミスが大陸会議に加わっていれば、さらに葉巻工場にアップグレードできます。タバコ店は葉巻の生産量を増やします。
model.building.townHall.name=市庁舎
model.building.townHall.description=市庁舎はアップグレードできない建物で、最大3人の入植者が自由の鐘を生産する働き場所となります。印刷所と新聞社を建設すると、その効果が高まります。
model.building.university.name=大学
model.building.university.description=人口4以上の植民地では学校を建設でき、熟練職人が未熟な入植者に自分の技能を教えられるようになります。人口が8に達すると学院にアップグレードでき、2人の教師がより多くの技能を教えられます。人口が10に達すると学院を大学に建て替えることができ、3人の教師があらゆる技能を教えられます。\n\n大学では技能レベル3までの技能を教えられます。
model.building.warehouse.name=倉庫
model.building.warehouse.description=倉庫はあらゆる種類の物資を保管します。貯蔵庫からの最初のアップグレードで、容量は各物資200単位です。さらに倉庫増築を建設すると容量は300単位になります。
model.building.warehouseExpansion.name=倉庫増築
model.building.warehouseExpansion.description=増築された倉庫はあらゆる種類の物資を保管します。通常の倉庫からのアップグレードで、容量は各物資300単位です。
model.building.weaverHouse.name=機織小屋
model.building.weaverHouse.description=機織小屋は綿花から布を生産するための建物で、織物店にアップグレードできます。植民地の人口が8以上になり、アダム・スミスが大陸会議に加わっていれば、織物工場にアップグレードできます。
model.building.weaverShop.name=織物店
model.building.weaverShop.description=織物店は綿花から布を生産するための建物で、織物工場にアップグレードできます。植民地の人口が8以上になり、アダム・スミスが大陸会議に加わっていれば、織物工場にアップグレードできます。織物店は布の生産量を増やします。

