# Terrain
model.tile.arctic.name=北極
model.tile.arctic.description=北極は、そのほとんどが氷に覆われた広大な海と、樹木のない凍った大地からなり、何も産出しません。北極点と南極点の近くにあり、通常は植民地を維持できません。
model.tile.borealForest.name=北方林
model.tile.borealForest.description=北方林は穀物、木材、毛皮と、いくらかの鉱石を産出します。極地の近くに見られ、伐採するとツンドラになります。
model.tile.broadleafForest.name=広葉樹林
model.tile.broadleafForest.description=広葉樹林は穀物、木材、毛皮と、いくらかの綿花を産出します。温帯に見られ、伐採するとプレーリーになります。
model.tile.coniferForest.name=針葉樹林
model.tile.coniferForest.description=針葉樹林は穀物、木材、毛皮と、いくらかのタバコを産出します。主に熱帯に見られ、伐採すると草地になります。
model.tile.desert.name=砂漠
model.tile.desert.description=砂漠は非常に乾燥しており、降水はごくわずかです。量は乏しいものの、穀物、綿花、鉱石を産出します。
model.tile.grassland.name=草地
model.tile.grassland.description=草地は、草に覆われた開けた平坦な土地が続く地形です。高地の温帯林や亜熱帯の砂漠の近くによく見られます。草地はタバコの栽培に最適で、食料も育てられます。
model.tile.greatRiver.name=大河
model.tile.greatRiver.description=大河は、船が航行できる川です。
model.tile.highSeas.name=外洋
model.tile.highSeas.description=外洋では魚が獲れます。また、船がヨーロッパへ行き来するための海路でもあります。
model.tile.hills.name=丘陵
model.tile.hills.description=丘陵は、周囲の地形より高く盛り上がった限られた範囲の土地です。丘陵は大量の鉱石と、いくらかの穀物を産出します。
model.tile.lake.name=湖
model.tile.lake.description=湖は内陸の水域です。隣接して建設した植民地は湖の天然資源の恩恵を受けられますが、船では到達できないことがあります。
model.tile.marsh.name=沼沢地
model.tile.marsh.description=沼沢地は湿原の一種で、浅い水辺にイネ科の草、イグサ、アシ、ガマ、スゲなどの草本植物が生い茂っています。沼沢地はいくらかの穀物とタバコ、そして鉱石を産出します。主に極地の近くに見られます。
model.tile.mixedForest.name=混交林
model.tile.mixedForest.description=温帯に見られる混交林は、穀物、木材、毛皮と、いくらかの綿花を産出します。混交林を伐採すると平原になります。
model.tile.mountains.name=山岳
model.tile.mountains.description=山岳は、周囲の地形より高くそびえる限られた範囲の土地で、一般に丘陵よりも険しい地形です。移動が困難で、植民地を建設することはできません。高い防御ボーナスを与えますが、防御態勢をとってもこのボーナスは増えません。採掘によって鉱石や銀を得るのに役立ちます。
model.tile.ocean.name=海
model.tile.ocean.description=海は広大な塩水の水域で、漁業に適しています。陸地の近く、特に河口付近では魚の量が増えます。
model.tile.plains.name=平原
model.tile.plains.description=平原は起伏の少ない広大な土地で、農業に適しています。大量の穀物と、それより少ない綿花、いくらかの鉱石を産出します。温帯に見られます。
model.tile.prairie.name=プレーリー
model.tile.prairie.description=プレーリーは草や草本植物が育ち、樹木の少ない土地で、一般に穏やかな温帯の気候です。プレーリーは穀物と綿花の栽培に最も適しています。
model.tile.rainForest.name=熱帯雨林
model.tile.rainForest.description=熱帯雨林は穀物、木材、毛皮と、いくらかの鉱石とサトウキビを産出します。熱帯に見られ、伐採すると湿地になります。
model.tile.savannah.name=サバンナ
model.tile.savannah.description=サバンナは、草と樹木がともに優占する植生の土地です。森林や疎林の地域と、草地や砂漠の地域との間の移行帯としてよく見られます。サバンナは主に穀物とサトウキビを産出します。
model.tile.scrubForest.name=低木林
model.tile.scrubForest.description=低木林は穀物、木材、毛皮と、いくらかの綿花と鉱石を産出します。伐採すると砂漠になります。低木林は温帯に見られます。
model.tile.swamp.name=湿地
model.tile.swamp.description=浅い水域のそばにある熱帯の湿原です。湿地は開けた水面の割合が大きく、一般に沼沢地よりも水深があります。湿地はいくらかの穀物と、少量のサトウキビと鉱石を産出します。
model.tile.tropicalForest.name=熱帯林
model.tile.tropicalForest.description=熱帯林は穀物、木材、毛皮と、いくらかのサトウキビを産出します。熱帯林を伐採するとサバンナになります。
model.tile.tundra.name=ツンドラ
model.tile.tundra.description=ツンドラは、低温と短い生育期間のために樹木の生長が妨げられている土地です。ツンドラは穀物と、いくらかの鉱石を産出します。極地の近くに見られます。
model.tile.wetlandForest.name=湿地林
model.tile.wetlandForest.description=湿地林は穀物、木材、毛皮と、いくらかの鉱石を産出します。湿地林を伐採すると沼沢地になります。極地の近くに見られます。

# Units/Colonists. The abstract ones are needed only by GenerateDocumentation.
colonist.name=入植者(抽象)
colonist.description=入植者ユニットの基本型
ship.name=船(抽象)
ship.description=船ユニットの基本型
wagon.name=荷馬車(抽象)
wagon.description=荷馬車ユニットの基本型
model.unit.colonialRegular.name={{plural:%number%|one=植民地正規兵|other=植民地正規兵|default=植民地正規兵}}
model.unit.colonialRegular.description=植民地正規兵は、独立宣言の後にのみ利用できる精鋭ユニットです。
model.unit.elderStatesman.name={{plural:%number%|one=老練政治家|other=老練政治家|default=老練政治家}}
model.unit.elderStatesman.description=老練政治家は入植者の独立への熱意(自由の鐘で表されます)を高め、植民地における自由の息子の支持率を増やします。
model.unit.expertFarmer.name={{plural:%number%|one=熟練農夫|other=熟練農夫|default=熟練農夫}}
model.unit.expertFarmer.description=熟練農夫は食料生産の専門家です。
model.unit.expertFisherman.name={{plural:%number%|one=熟練漁師|other=熟練漁師|default=熟練漁師}}
model.unit.expertFisherman.description=熟練漁師は魚を獲る専門家です。獲れた魚は自動的に食料になります。
model.unit.expertFurTrapper.name={{plural:%number%|one=熟練罠猟師|other=熟練罠猟師|default=熟練罠猟師}}
model.unit.expertFurTrapper.description=熟練罠猟師は毛皮の生産を専門とします。
model.unit.expertLumberJack.name={{plural:%number%|one=熟練きこり|other=熟練きこり|default=熟練きこり}}
model.unit.expertLumberJack.description=熟練きこりは木を切り倒して木材を生産します。
model.unit.expertOreMiner.name={{plural:%number%|one=熟練鉱夫|other=熟練鉱夫|default=熟練鉱夫}}
model.unit.expertOreMiner.description=熟練鉱夫は鉱石の採掘に優れています。
model.unit.expertSilverMiner.name={{plural:%number%|one=熟練銀鉱夫|other=熟練銀鉱夫|default=熟練銀鉱夫}}
model.unit.expertSilverMiner.description=熟練銀鉱夫は、他のどのユニットよりも多くの銀を産出します。
model.unit.firebrandPreacher.name={{plural:%number%|one=熱血説教師|other=熱血説教師|default=熱血説教師}}
model.unit.firebrandPreacher.description=熱血説教師はヨーロッパの宗教的動揺(十字架で表されます)を高め、その結果として新大陸への移民を増やします。
model.unit.freeColonist.name={{plural:%number%|one=自由入植者|other=自由入植者|default=自由入植者}}
model.unit.freeColonist.description=自由入植者は、これといった技能を持たない新参者です。しかし、植民地のタイルで働いたり先住民の集落を訪れたりすることで、技能を持つユニットになれます。また、古参兵に昇進したり、学校を建てた植民地で教育を受けたりすることもできます。
model.unit.hardyPioneer.name={{plural:%number%|one=屈強な開拓者|other=屈強な開拓者|default=屈強な開拓者}}
model.unit.hardyPioneer.description=屈強な開拓者は、森林伐採、開墾、道路建設に優れています。
model.unit.indenturedServant.name={{plural:%number%|one=年季奉公人|other=年季奉公人|default=年季奉公人}}
model.unit.indenturedServant.description=年季奉公人は屋外の仕事に向いていますが、屋内の仕事にはあまり向いていません。昇進や教育によって自由入植者になることがあります。
model.unit.indianConvert.name={{plural:%number%|one=先住民改宗者|other=先住民改宗者|default=先住民改宗者}}
model.unit.indianConvert.description=先住民改宗者は、植民地に加わった先住民です。あらゆる屋外の仕事に長けていますが、屋内の仕事は不得手です。バルトロメ・デ・ラス・カサスが大陸会議に加わると、すべての先住民改宗者は自由入植者になります。
model.unit.jesuitMissionary.name={{plural:%number%|one=イエズス会宣教師|other=イエズス会宣教師|default=イエズス会宣教師}}
model.unit.jesuitMissionary.description=イエズス会宣教師は先住民の集落に伝道所を設立でき、先住民の改宗にとりわけ長けています。
model.unit.masterBlacksmith.name={{plural:%number%|one=熟練鍛冶職人|other=熟練鍛冶職人|default=熟練鍛冶職人}}
model.unit.masterBlacksmith.description=熟練鍛冶職人は鉱石から道具を鍛造します。
model.unit.masterCarpenter.name={{plural:%number%|one=熟練大工|other=熟練大工|default=熟練大工}}
model.unit.masterCarpenter.description=熟練大工は、植民地での建物やユニットの生産にとりわけ長けています。
model.unit.masterCottonPlanter.name={{plural:%number%|one=熟練綿花農家|other=熟練綿花農家|default=熟練綿花農家}}
model.unit.masterCottonPlanter.description=熟練綿花農家は綿花を栽培します。
model.unit.masterDistiller.name={{plural:%number%|one=熟練蒸留職人|other=熟練蒸留職人|default=熟練蒸留職人}}
model.unit.masterDistiller.description=熟練蒸留職人はサトウキビからラム酒を作ります。
model.unit.masterFurTrader.name={{plural:%number%|one=熟練毛皮商|other=熟練毛皮商|default=熟練毛皮商}}
model.unit.masterFurTrader.description=熟練毛皮商は毛皮から毛皮のコートを作ります。
model.unit.masterGunsmith.name={{plural:%number%|one=熟練銃鍛冶|other=熟練銃鍛冶|default=熟練銃鍛冶}}
model.unit.masterGunsmith.description=熟練銃鍛冶は道具からマスケット銃を作ります。
model.unit.masterSugarPlanter.name={{plural:%number%|one=熟練サトウキビ農家|other=熟練サトウキビ農家|default=熟練サトウキビ農家}}
model.unit.masterSugarPlanter.description=熟練サトウキビ農家はサトウキビを栽培します。
model.unit.masterTobaccoPlanter.name={{plural:%number%|one=熟練タバコ農家|other=熟練タバコ農家|default=熟練タバコ農家}}
model.unit.masterTobaccoPlanter.description=熟練タバコ農家はタバコを栽培します。
model.unit.masterTobacconist.name={{plural:%number%|one=熟練タバコ職人|other=熟練タバコ職人|default=熟練タバコ職人}}
model.unit.masterTobacconist.description=熟練タバコ職人はタバコから葉巻を作ります。
model.unit.masterWeaver.name={{plural:%number%|one=熟練織工|other=熟練織工|default=熟練織工}}
model.unit.masterWeaver.description=熟練織工は綿花から布を織ります。
model.unit.pettyCriminal.name={{plural:%number%|one=軽犯罪者|other=軽犯罪者|default=軽犯罪者}}
model.unit.pettyCriminal.description=軽犯罪者は屋外の仕事には向いていますが、屋内の仕事には向いていません。昇進や教育によって年季奉公人になることがあります。
model.unit.seasonedScout.name={{plural:%number%|one=熟練斥候|other=熟練斥候|default=熟練斥候}}
model.unit.seasonedScout.description=熟練斥候は新大陸の探検、とりわけ先住民の集落や失われた都市の噂の調査に最も適しています。
model.unit.veteranSoldier.name={{plural:%number%|one=古参兵|other=古参兵|default=古参兵}}
model.unit.veteranSoldier.description=古参兵は経験豊かな軍事ユニットです。自由入植者は戦闘に勝利すると古参兵に昇進することがあります。

# Units/Naval
model.unit.caravel.name={{plural:%number%|one=キャラベル船|other=キャラベル船|default=キャラベル船}}
model.unit.caravel.description=キャラベル船は小型で、あまり速くもない商船です。
model.unit.frigate.name={{plural:%number%|one=フリゲート艦|other=フリゲート艦|default=フリゲート艦}}
model.unit.frigate.description=フリゲート艦は小型の軍艦です。
model.unit.galleon.name={{plural:%number%|one=ガレオン船|other=ガレオン船|default=ガレオン船}}
model.unit.galleon.description=ガレオン船は大型の商船です。財宝運搬隊をヨーロッパへ運べる唯一の船です。
model.unit.manOWar.name={{plural:%number%|one=戦列艦|other=戦列艦|default=戦列艦}}
model.unit.manOWar.description=戦列艦は大型の軍艦です。王室のほかは、独立宣言の後にのみ利用できます。
model.unit.merchantman.name={{plural:%number%|one=商船|other=商船|default=商船}}
model.unit.merchantman.description=商船は中型の貿易船です。
model.unit.privateer.name={{plural:%number%|one=私掠船|other=私掠船|default=私掠船}}
model.unit.privateer.description=私掠船は、出身国の旗を掲げずに航行する小型の軍艦です。宣戦布告なしに他のユニットを攻撃できる唯一のユニットです。

# Units/Others
model.unit.artillery.name={{plural:%number%|one=大砲|other=大砲|default=大砲}}
model.unit.artillery.description=大砲は植民地の攻撃と防衛に優れていますが、野外では非常に脆弱です。
model.unit.damagedArtillery.name={{plural:%number%|one=損傷した大砲|other=損傷した大砲|default=損傷した大砲}}
model.unit.damagedArtillery.description=損傷した大砲は、あらゆる点で大砲と同じですが、より弱くなっています。
model.unit.treasureTrain.name={{plural:%number%|one=財宝運搬隊|other=財宝運搬隊|default=財宝運搬隊}}
model.unit.treasureTrain.description=財宝運搬隊の唯一の役割は、失われた都市の遺跡で見つけた、あるいは先住民の集落から略奪したゴールドを運ぶことです。自分の植民地に移動させると、王室が手ごろな手数料でヨーロッパまで輸送しようと申し出てきます。ガレオン船があれば、自分でヨーロッパへ運ぶこともできます。
model.unit.wagonTrain.name={{plural:%number%|one=幌馬車隊|other=幌馬車隊|default=幌馬車隊}}
model.unit.wagonTrain.description=幌馬車隊は、最大200単位の物資を陸路で運べます。他のプレイヤーとの交易や、自分の植民地間での物資の輸送に使えます。

# Units/REF
model.unit.kingsRegular.name={{plural:%number%|one=国王軍正規兵|other=国王軍正規兵|default=国王軍正規兵}}
model.unit.kingsRegular.description=国王軍正規兵は、王室だけが利用できる精鋭ユニットです。独立宣言の後、王立遠征軍が到着したときにのみ目にすることになります。

# Units/Natives
model.unit.brave.name={{plural:%number%|one=戦士|other=戦士|default=戦士}}
model.unit.brave.description=戦士は、少量の物資を運べる先住民のユニットです。武装したり騎乗したりすることもあります。戦士はしばしば、贈り物を届けたり要求を突きつけたりするために植民地を訪れます。

# Units/Undead
model.unit.flyingDutchman.name=フライング・ダッチマン
model.unit.flyingDutchman.description=フライング・ダッチマンは呪われた者たちの船です。
model.unit.revenger.name=船長
model.unit.revenger.description=船長は悪魔に魂を売り渡しました。
model.unit.undead.name=アンデッド
model.unit.undead.description=アンデッドはフライング・ダッチマンの乗組員です。

