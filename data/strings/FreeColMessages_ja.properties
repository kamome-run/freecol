declareIndependence.interventionForce={{tag:country|%nation%}}は、貴国の正当な独立闘争を支援するため、介入軍を派遣することを厳粛に誓約します。ただし、その決意を示すため、%number%個の{{plural:%number%|one=自由の鐘|other=自由の鐘}}を生産することが条件です。
declareIndependence.nativeSupport=%nation%の人々は%ruler%と王立遠征軍への侮蔑を表明し、機会あるごとに彼らを攻撃すると約束しました。
declareIndependence.nativeHostile=王立遠征軍が%nation%と友好関係を結んだと諜報員が報告しています。攻撃を企てている恐れがあるので警戒してください！
declareIndependence.resolution=この日、大陸会議はアメリカでかつて採択された中で最も重要な決議を可決した。\n\nこの宣言を守り抜き、これらの邦を支え防衛するために、我々がどれほどの労苦と血と財を払うことになるか、私は十分に承知している。それでも、あらゆる暗闇の中に、私は心を奪うような光と栄光の輝きを見ている。目的は手段のすべてに余りある価値があると確信している。そして、たとえ我々がこの日を悔いることになろうとも(神にかけてそうはならぬと信じるが)、後世の人々はこの日の決断を勝利として讃えるであろう。\n\n王立遠征軍はまもなく我々のもとに迫ってくる。新たな大陸軍の志願兵を募る間、防備を怠りなく整えよ。
