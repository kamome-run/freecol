colopedia.concepts.education.name=教育
colopedia.concepts.education.description=<html><p>入植者を教育する最も効率的な方法は、<a href="http:///id/model.building.schoolhouse">学校</a>を建設し、熟練ユニットを教師として配置することです。教師は<a href="http:///id/model.unit.freeColonist">自由入植者</a>を自分と同じ職種の熟練者に育てます。また、教師は<a href="http:///id/model.unit.pettyCriminal">軽犯罪者</a>を<a href="http:///id/model.unit.indenturedServant">年季奉公人</a>に、年季奉公人を自由入植者に引き上げることもできます。</p><p>一部の技能は、自由入植者や年季奉公人を先住民の集落に1ターン滞在させることで、先住民から学ぶこともできます。さらに、自由入植者を植民地のタイルで働かせれば、経験によって技能を身につけることもあります。植民地周辺の畑や森林で働く自由入植者は最大200ポイントの経験を蓄積し、これは4パーセントの確率で熟練者に昇格することに相当します。</p></html>
colopedia.concepts.efficiency.name=効率
colopedia.concepts.efficiency.description=<html><p>植民地の効率は、独立の理念への支持の度合いによって決まります。入植者の50パーセントが独立派を支持すると、植民地は+1の生産ボーナスを得ます。入植者の100パーセントが独立派になると、生産ボーナスは+2に増えます。</p><p>一方、王党派の数が<i>悪政の限界</i>を超えると、植民地は-1の生産ペナルティを受けます。王党派の数が<i>深刻な悪政の限界</i>を超えると、生産ペナルティは-2に増えます。この2つの限界値は難易度によって異なり、<a href="http:///action/difficultyAction">難易度レポート</a>で確認できます。</p><p>植民地の効率を上げるには、人口を減らすか、より多くの<a href="http:///id/model.goods.bells">自由の鐘</a>を生産する必要があります。</p></html>
colopedia.concepts.fortification.name=防御態勢
colopedia.concepts.fortification.description=<html><p>ユニットはタイル上で<em>防御態勢</em>を取る(仮設の塹壕や障壁を築く)ことで、防御力を高めることができます。完全な防御態勢を取るには1ターンかかります。防御態勢を取ったユニットは待ち伏せを受けなくなり、防御態勢の大砲は「野外にいる」とはみなされなくなります。ただし、攻撃を受けると防御設備は損傷します。防御態勢によるボーナスは、他に有利な防御要素がない場合にのみ得られます。したがって、山岳上や、砦・要塞のある植民地内で防御態勢を取ってもボーナスはありません。</p></html>
colopedia.concepts.independence.name=独立
colopedia.concepts.independence.description=<html><p>ゲーム開始時、わずかなユニットを率いる探検家として新大陸に降り立ちます。国王は、新大陸に植民地を築き、財宝や珍しい物資を本国の港へ送ってくることを期待しています。しかし、こちらには別の考えがあります。独立した国家を樹立することです。</p><p>独立を宣言するには、植民地の人口の少なくとも50%を独立派に引き入れる必要があります。そのためには<a href="http:///id/model.goods.bells">自由の鐘</a>を生産します。自由の鐘は植民地の<a href="http:///id/colopedia.concepts.efficiency">効率</a>も高めます。</p><p>想像のとおり、国王がそのまま独立を認めることはありません。独立を宣言した後は、<a href="http:///id/colopedia.concepts.ref">王立遠征軍</a>(REF)と戦い、これを撃破しなければなりません。王立遠征軍が沿岸の植民地をすべて制圧するか、人口の90%以上を支配下に置いた場合、独立の試みは失敗に終わります。</p></html>
colopedia.concepts.interventionForce.name=介入軍
colopedia.concepts.interventionForce.description=<html><p>植民地が<a href="http:///id/colopedia.concepts.independence">独立</a>を宣言しようとすれば、本国は必ず弱体化します。これは本国の敵国にとって好都合です。そのため、敵国の一つが<i>介入軍</i>を派遣し、<i>独立戦争</i>において<a href="http:///id/colopedia.concepts.ref">王立遠征軍</a>と戦うあなたを支援します。ただし、十分な数の<a href="http:///id/model.goods.bells">自由の鐘</a>を生産することが条件です。</p><p>ゲームの進行に伴い、<i>介入軍</i>と<a href="http:///id/colopedia.concepts.ref">王立遠征軍</a>の双方に、さらなるユニットが増援されます。</p></html>
colopedia.concepts.ref.name=王立遠征軍
colopedia.concepts.ref.description=<html><p>国王は、税を払おうとせず王室の正当な要求にも従わない、寄せ集めのコンキスタドールや宗教的不満分子の集まりなど信用していません。そのため国王は、<a href="http:///id/colopedia.concepts.independence">独立</a>を宣言して本国から離反しようとするあらゆる試みを鎮圧するため、特別な<i>王立遠征軍</i>(REF)を常備しています。</p><p><i>王立遠征軍</i>に対しては、あなたの大義に共感する外国が派遣する<a href="http:///id/colopedia.concepts.interventionForce">介入軍</a>がある程度の対抗勢力となります。ただし、十分な数の<a href="http:///id/model.goods.bells">自由の鐘</a>を生産することが条件です。<i>王立遠征軍</i>と<a href="http:///id/colopedia.concepts.interventionForce">介入軍</a>の双方には、時折さらなるユニットが追加されます。</p></html>
colopedia.concepts.taxes.name=税
colopedia.concepts.taxes.description=<html><p>ゲーム序盤、国王は収入に税を課しません。しかし時が経つにつれ、国王は納得できるようなできないような様々な理由をつけて、必ず売上税を引き上げてきます。国王が増税を提案するたびに、これを拒否することもできます。その場合、特定の種類の物資がボイコットされ、その物資をヨーロッパで売買できなくなります。さらに、いずれかの植民地で、激怒した入植者によってその物資が最大100個破棄されます。</p><p>ボイコットは、滞納した税を支払う(高くつきます)か、<a href="http:///id/model.foundingFather.jacobFugger">ヤーコプ・フッガー</a>を大陸会議に選出することで解除できます。</p></html>

colopedia.foundingFather.description=建国の父(および母)は、著名な商人・探検家・軍人・政治家・聖職者の一団で、大陸会議に選出されるとすぐに特別な能力をもたらします。建国の父を選出するには一定数の自由の鐘を生産する必要があり、必要数は選出のたびに増加します。\n\nすべての建国の父はゲームを通じて選出可能ですが、候補に挙がる確率は時期によって変化します。また、すべての建国の父はヨーロッパのすべての国が選出でき、他国がすでに選出していても構いません。

